name: CD

on:
  # runs at JST0:00 on Sundays
  schedule:
    - cron: "0 15 * * 6"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GL_TOKEN: ${{ secrets.GL_TOKEN }}
        run: git clone --depth=1 "https://oauth2:$GL_TOKEN@gitlab.com/isiin/silverblue-nix.git" workspace

      - name: Podman login
        env:
          REG_NAME: "quay.io"
          REG_USER: ${{ github.actor }}
          REG_PASS: ${{ secrets.REG_PASS }}
          AUTHFILE: "/tmp/auth.json"
        run: |
          echo "$REG_PASS" | podman login --password-stdin \
            --authfile="$AUTHFILE" -u "$REG_USER" "$REG_NAME"
          echo "REGISTRY_AUTH_FILE=$AUTHFILE" >> $GITHUB_ENV

      - name: Deploy
        run: |
          cd workspace
          sudo -E ./deploy.sh

